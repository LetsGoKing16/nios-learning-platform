<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIOS Academy - Secondary Courses Interactive Learning Platform</title>
  <meta name="description" content="Official curriculum interactive educational platform for NIOS Secondary (Class 10) courses with restored videos, lesson quizzes, fact fluency, analytics, Mastery AI, and study tools.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-family='sans-serif' font-size='55' font-weight='900' fill='white' text-anchor='middle'>N</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: {
              DEFAULT: 'var(--card)',
              foreground: 'var(--card-foreground)',
            },
            popover: {
              DEFAULT: 'var(--popover)',
              foreground: 'var(--popover-foreground)',
            },
            primary: {
              DEFAULT: 'var(--primary)',
              foreground: 'var(--primary-foreground)',
            },
            secondary: {
              DEFAULT: 'var(--secondary)',
              foreground: 'var(--secondary-foreground)',
            },
            muted: {
              DEFAULT: 'var(--muted)',
              foreground: 'var(--muted-foreground)',
            },
            accent: {
              DEFAULT: 'var(--accent)',
              foreground: 'var(--accent-foreground)',
            },
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
          }
        }
      }
    };
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
  <!-- Application Mount Point with Instant Inline Preloader -->
  <div id="app-root">
    <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
      <div style="width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: white; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(37,99,235,0.4);">
        N
      </div>
      <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;">NIOS Academy</h1>
      <p style="font-size: 13px; color: #94a3b8; max-width: 320px; line-height: 1.5; margin-bottom: 20px;">
        Loading 11 Secondary Courses, Video Lectures & Interactive Study Tools...
      </p>
      <div style="width: 180px; height: 4px; background: #1e293b; border-radius: 999px; overflow: hidden;">
        <div style="width: 60%; height: 100%; background: linear-gradient(90deg, #2563eb, #818cf8); border-radius: 999px;"></div>
      </div>
    </div>
  </div>

  <!-- Main ES Module Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
